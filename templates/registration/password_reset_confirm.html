{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Digite sua nova senha{% endblock title %}

{% block content %}
    <h1>Escolha uma nova senha!</h1>
    <form method="post">
        {% csrf_token %}
        {{form | crispy}}
        <input class="btn btn-success" type="submit" value="Alterar senha">
    </form>

{% endblock content %}
